name: CD
on:
  push:
    tags:
      - "v*.*.*"
permissions:
  contents: write
concurrency:
  group: cd-${{ github.ref }}
env:
  BIN_NAME: "skimmer"
  CARGO_TERM_COLOR: always
jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - riscv64gc-unknown-linux-gnu
    env:
      GPG_RELEASE_KEY: ${{ secrets.GPG_RELEASE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
      - name: Set the release version
        shell: bash
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Verify the tag matches the manifest
        shell: bash
        run: |
          manifest_version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg name "$BIN_NAME" \
              '.packages[] | select(.name == $name) | .version')"
          if [ "$manifest_version" != "$RELEASE_VERSION" ]; then
            echo "tag v$RELEASE_VERSION does not match Cargo.toml version" \
              "$manifest_version" >&2
            exit 1
          fi
      - name: Install cross
        uses: taiki-e/install-action@cross
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cross build --release --locked --target ${{ matrix.target }}
      - name: Prepare release assets
        shell: bash
        run: |
          release_dir="$BIN_NAME-$RELEASE_VERSION"
          mkdir -p "$release_dir"
          cp LICENSE-MIT LICENSE-APACHE "$release_dir"/
          if [ -f README.md ]; then
            cp README.md "$release_dir"/
          fi
          cp "target/${{ matrix.target }}/release/$BIN_NAME" "$release_dir"/
      - name: Create release artifacts
        shell: bash
        run: |
          archive="$BIN_NAME-$RELEASE_VERSION-${{ matrix.target }}.tar.gz"
          tar -czvf "$archive" "$BIN_NAME-$RELEASE_VERSION/"
          sha512sum "$archive" > "$archive.sha512"
      - name: Sign the release
        if: env.GPG_RELEASE_KEY != ''
        shell: bash
        run: |
          archive="$BIN_NAME-$RELEASE_VERSION-${{ matrix.target }}.tar.gz"
          printf '%s' "$GPG_RELEASE_KEY" | base64 --decode > private.key
          printf '%s' "$GPG_PASSPHRASE" | gpg --pinentry-mode=loopback \
            --passphrase-fd 0 --import private.key
          rm -f private.key
          printf '%s' "$GPG_PASSPHRASE" | gpg --pinentry-mode=loopback \
            --passphrase-fd 0 --detach-sign "$archive"
      - name: Upload the build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.target }}
          path: ${{ env.BIN_NAME }}-${{ env.RELEASE_VERSION }}-${{ matrix.target }}.tar.gz*
          if-no-files-found: error
  release:
    name: Publish the GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download the build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ env.BIN_NAME }}-*
          merge-multiple: true
      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          args: --latest --github-repo ${{ github.repository }}
        env:
          OUTPUT: CHANGES.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload the release assets
        uses: svenstaro/upload-release-action@v2
        with:
          file: ${{ env.BIN_NAME }}-*.tar.gz*
          file_glob: true
          overwrite: true
          tag: ${{ github.ref }}
          release_name: Release ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: ${{ steps.git-cliff.outputs.content }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
  publish-crates-io:
    name: Publish on crates.io
    needs: release
    # Prerelease tags (v1.2.3-alpha.1) stay off crates.io.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Publish
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish --locked
