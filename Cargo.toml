[workspace]
resolver = "3"
members  = ["apps/server"]

[profile.dev]
opt-level = 0
debug     = true

[profile.test]
opt-level = 0
debug     = true

[profile.release]
opt-level     = 3
debug         = false
panic         = "abort"
lto           = true
codegen-units = 1
strip         = true

[profile.bench]
opt-level = 3
debug     = false
