[package]
name         = "skimmer"
version      = "0.2.0-alpha.1"
description  = "AI agent that reads your RSS feeds and keeps only what's worth your time."
authors      = ["wallago <tbd@gmail.com>"]
license      = "MIT OR Apache-2.0"
readme       = "../../README.md"
repository   = "https://github.com/wallago/skimmer"
keywords     = []
categories   = []
edition      = "2024"
rust-version = "1.89"
include      = ["src/**/*", "Cargo.*", "LICENSE*", "README.md", "CHANGELOG.md"]

[dependencies]
axum = "0.8.9"
better-panic = "0.3.0"
chrono = "0.4.45"
clap = { version = "4.6.6", features = [
  "derive",
  "env",
  "wrap_help",
  "cargo",
] }
dirs = "7.0.0"
duration-str = "0.21.0"
reqwest = { version = "0.13.4", features = ["query", "json"] }
rusqlite = { version = "0.43", features = ["bundled", "chrono"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1", features = ["full"] }
toml = "1.1.4"
tower-http = { version = "0.7", features = ["fs", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"

[dev-dependencies]
http              = "1.5.0"
jsonschema        = "0.63.1"
pretty_assertions = "1.4.1"
rstest            = "0.29"
tower             = { version = "0.5", features = ["util"] }
wiremock          = "0.6.5"

[lints.rust]
missing_docs                  = "warn"
missing_debug_implementations = "warn"
unreachable_pub               = "warn"
unused_qualifications         = "warn"

[lints.clippy]
pedantic                      = { level = "warn", priority = -1 }
unwrap_used                   = "warn"
expect_used                   = "warn"
panic                         = "warn"
todo                          = "warn"
dbg_macro                     = "warn"
print_stdout                  = "warn"
missing_docs_in_private_items = "warn"
