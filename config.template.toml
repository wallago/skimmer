output = "/dev/null"

reader = """
Rust developer on NixOS, writing CLIs and TUIs. Self-hosts everything;
runs Miniflux, Jellyfin, a Proxmox box. Rides road and gravel.
Cares about: async Rust internals, terminal UX, Nix flakes, kernel and
filesystem work, self-hosting ops.
Already knows the basics — skip explainers, lead with what changed.
"""

[miniflux]
url      = "http://0.0.0.0"
username = "username"
password = "password"

[claude]
api_key = "key"
model   = "claude-opus-5"

[topic.rust]
question = "What's going on interesting in the Rust world the past day?"
feeds    = ["Reddit Rust", "This Week in Rust"]
context  = "I care about async internals, TUI crates and build tooling. Show me crates I'd actually depend on, not weekend projects."
interval = "7d"

[topic.youtube]
question = "What's new for those video channel the past week?"
feeds    = ["Youtube DevOps Toolbox", "Youtube Vimjoyer"]
interval = "7d"

[topic.bicycle]
question   = "What's new and interesting in the bicycle world the past day?"
categories = ["cycling"]
interval   = "7d"
